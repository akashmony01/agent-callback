name: Works on my setup
description: Report that agent-callback works (or partly works) on a desktop or terminal marked untested
labels: [compatibility]
body:
  - type: input
    id: os
    attributes:
      label: OS and desktop
      placeholder: "Linux Mint 22 Cinnamon (X11)"
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal or editor
      placeholder: "GNOME Terminal / Kitty / VS Code / iTerm2 ..."
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: Sound
        - label: Notification
        - label: Clicking the notification jumps back to the right window
        - label: ...and to the exact tab
        - label: Silent while the screen is locked
  - type: textarea
    id: notes
    attributes:
      label: Notes (extra packages you installed, anything that didn't work)
